repository = "crimson-and-clover/daily-actions"
ref = "master"
timezone = "Asia/Shanghai"
# 重启或网络耗时错过计划后，仅在五分钟内尝试最近一次计划；不补发历史日报。
grace_seconds = 300

[[jobs]]
workflow = "market-fx.yml"
cron = "15 6 * * tue-sat"

[[jobs]]
workflow = "world-news.yml"
cron = "35 7 * * *"

[[jobs]]
workflow = "inbox-agent.yml"
cron = "10 8,13,20 * * *"

[[jobs]]
workflow = "paper-agent.yml"
cron = "35 8 * * mon-fri"

[[jobs]]
workflow = "glados-checkin.yml"
cron = "20 8 * * *"

[[jobs]]
workflow = "ffmpeg-mirror.yml"
cron = "15 10 * * sun"

[[jobs]]
workflow = "reviewer-radar.yml"
# 保留原 cron 的月日步进语义：每月 1、6、11、16、21、26、31 日（如存在）。
cron = "30 8 */5 * *"

[[jobs]]
workflow = "inbox-history-agent.yml"
cron = "25 3 * * *"
enabled = false
