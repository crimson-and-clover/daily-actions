<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Actions 知识与研报中心</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            margin: 0;
            padding: 40px 20px;
        }
        .box {
            max-width: 680px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.04);
        }
        h1 {
            font-size: 22px;
            margin-top: 0;
        }
        p {
            color: #64748b;
            font-size: 14px;
        }
        .card {
            display: block;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 18px 20px;
            text-decoration: none;
            color: inherit;
            margin-top: 16px;
            transition: all 0.2s ease;
        }
        .card:hover {
            border-color: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37,99,235,0.08);
        }
        .card-title {
            font-size: 16px;
            font-weight: bold;
            color: #0f172a;
            margin-bottom: 4px;
        }
        .card-desc {
            font-size: 13px;
            color: #64748b;
        }
        .tag {
            display: inline-block;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
            margin-bottom: 8px;
        }
        .tag-paper {
            background: #eff6ff;
            color: #1d4ed8;
        }
        .tag-market {
            background: #f0fdf4;
            color: #15803d;
        }
        .tag-news {
            background: #faf5ff;
            color: #7e22ce;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Daily Actions 知识与研报中心</h1>
        <p>由 GitHub Actions 自动化定期生成的高密度情报研报汇总站点。</p>
        
        <a class="card" href="paper-agent/index.html">
            <span class="tag tag-paper">CI: paper-agent</span>
            <div class="card-title">AI 前沿学术研报 (Resident Paper Agent) &rarr;</div>
            <div class="card-desc">自动驾驶、世界模型、WAM、具身智能与 VLA 策略的高清公式精读与各维度打分。</div>
        </a>

        <a class="card" href="market-fx/index.html" style="opacity: 0.8;">
            <span class="tag tag-market">CI: market-fx</span>
            <div class="card-title">全球宏观市场与出境汇率 (Market &amp; FX) &rarr;</div>
            <div class="card-desc">美股核心指数、科技七巨头、黄金大宗商品与澳元/越南盾出行换汇建议。</div>
        </a>

        <a class="card" href="world-news/index.html">
            <span class="tag tag-news">CI: world-news</span>
            <div class="card-title">全球宏观政经与前沿计算 (World News) &rarr;</div>
            <div class="card-desc">地缘宏观趋势、核心硬科技及开源社区高影响力动态。</div>
        </a>
    </div>
</body>
</html>
