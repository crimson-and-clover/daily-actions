name: Qodo PR-Agent AI Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-review:
    # 仅当在 PR 评论中明确包含 /ai-review 或 /review，由非 Bot 且具备仓库权限的用户触发
    if: |
      github.event.issue.pull_request != null &&
      github.event.sender.type != 'Bot' &&
      (contains(github.event.comment.body, '/ai-review') || contains(github.event.comment.body, '/review')) &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Normalize /ai-review Command for PR-Agent
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          # 将 /ai-review 指令规范化替换为 PR-Agent 原生识别的 /review
          python3 -c "
          import json, os
          path = os.environ.get('GITHUB_EVENT_PATH')
          if path and os.path.exists(path):
              with open(path, 'r', encoding='utf-8') as f:
                  data = json.load(f)
              if 'comment' in data and 'body' in data['comment']:
                  body = data['comment']['body']
                  if '/ai-review' in body:
                      data['comment']['body'] = body.replace('/ai-review', '/review')
                      with open(path, 'w', encoding='utf-8') as f:
                          json.dump(data, f, ensure_ascii=False)
                      print('Successfully normalized /ai-review to /review in event payload.')
          "

      - name: Run Qodo PR-Agent Review
        uses: qodo-ai/pr-agent@main
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_BASE: "https://api.deepseek.com/v1"
          CONFIG.MODEL: "deepseek/deepseek-chat"
          CONFIG.FALLBACK_MODELS: '["deepseek/deepseek-chat"]'
          CONFIG.RESPONSE_LANGUAGE: "zh-CN"
