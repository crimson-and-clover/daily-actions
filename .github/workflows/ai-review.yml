name: Qodo PR-Agent AI Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-review:
    # 仅当在 PR 评论中明确包含 /ai-review，由非 Bot 且具备仓库权限的用户触发
    if: |
      github.event.issue.pull_request != null &&
      github.event.sender.type != 'Bot' &&
      contains(github.event.comment.body, '/ai-review') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Run Qodo PR-Agent Review
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB__USER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB__DEPLOYMENT_TYPE: "user"
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_BASE: "https://api.deepseek.com/v1"
          CONFIG__MODEL: "deepseek/deepseek-chat"
          CONFIG__FALLBACK_MODELS: '["deepseek/deepseek-chat"]'
          CONFIG__RESPONSE_LANGUAGE: "zh-CN"
          CONFIG__GIT_PROVIDER: "github"
        run: |
          PR_URL="${{ github.event.issue.pull_request.html_url }}"
          if [ -z "$PR_URL" ]; then
            PR_URL="https://github.com/${{ github.repository }}/pull/${{ github.event.issue.number }}"
          fi
          echo "Starting Qodo PR-Agent static review for: $PR_URL"

          docker run --rm \
            -e PYTHONUNBUFFERED \
            -e GITHUB_TOKEN \
            -e GITHUB__USER_TOKEN \
            -e GITHUB__DEPLOYMENT_TYPE \
            -e DEEPSEEK_API_KEY \
            -e OPENAI_KEY \
            -e OPENAI_API_BASE \
            -e CONFIG__MODEL \
            -e CONFIG__FALLBACK_MODELS \
            -e CONFIG__RESPONSE_LANGUAGE \
            -e CONFIG__GIT_PROVIDER \
            -v "$GITHUB_WORKSPACE:/github/workspace" \
            --workdir /github/workspace \
            --entrypoint python \
            pragent/pr-agent:github_action \
            -m pr_agent.cli --pr_url="$PR_URL" review
