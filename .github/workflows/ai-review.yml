name: Qodo PR-Agent AI Review
run-name: Qodo 审查 · PR #${{ inputs.pr_number }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR 编号
        type: string
        required: true
      head_sha:
        description: 预期审查的提交 SHA（手动运行可留空）
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-review:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run Qodo PR-Agent Review
        shell: bash
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB__USER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB__DEPLOYMENT_TYPE: "user"
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_BASE: "https://api.deepseek.com/v1"
          CONFIG__MODEL: "deepseek/deepseek-chat"
          CONFIG__FALLBACK_MODELS: '["deepseek/deepseek-chat"]'
          CONFIG__RESPONSE_LANGUAGE: "zh-CN"
          CONFIG__GIT_PROVIDER: "github"
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "PR 编号无效。"
            exit 1
          fi
          pr=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,headRefOid,url)
          head_sha=$(jq -r .headRefOid <<< "$pr")
          if [[ $(jq -r .state <<< "$pr") != OPEN || ( -n "$EXPECTED_HEAD_SHA" && "$head_sha" != "$EXPECTED_HEAD_SHA" ) ]]; then
            echo "PR 已关闭或提交已更新，请针对当前提交重新发起审查。"
            exit 1
          fi
          PR_URL=$(jq -r .url <<< "$pr")
          echo "PR head: $head_sha"
          echo "Starting Qodo PR-Agent static review for: $PR_URL"

          docker run --rm \
            -e PYTHONUNBUFFERED \
            -e GITHUB_TOKEN \
            -e GITHUB__USER_TOKEN \
            -e GITHUB__DEPLOYMENT_TYPE \
            -e DEEPSEEK_API_KEY \
            -e OPENAI_KEY \
            -e OPENAI_API_BASE \
            -e CONFIG__MODEL \
            -e CONFIG__FALLBACK_MODELS \
            -e CONFIG__RESPONSE_LANGUAGE \
            -e CONFIG__GIT_PROVIDER \
            -v "$GITHUB_WORKSPACE:/github/workspace" \
            --workdir /github/workspace \
            --entrypoint python \
            pragent/pr-agent:github_action \
            -m pr_agent.cli --pr_url="$PR_URL" review
