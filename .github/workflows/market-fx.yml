name: Market FX

on:
  schedule:
    # UTC 22:15 (周一至周五) -> 北京时间 周二至周六 06:15 (美股周一至周五收盘后错峰)
    - cron: '15 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-market-fx:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code (master)
        uses: actions/checkout@v7

      - name: Checkout Agent State (state/market-fx branch)
        uses: actions/checkout@v7
        with:
          ref: state/market-fx
          path: state
          fetch-depth: 0
        continue-on-error: true

      - name: Checkout existing Docs (gh-pages branch)
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: docs
        continue-on-error: true

      - name: Clean git metadata from docs
        run: rm -rf docs/.git
        continue-on-error: true

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Run Market & FX Report
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          PAGES_BASE_URL: https://crimson-and-clover.github.io/daily-actions
          PYTHONUNBUFFERED: "1"
        run: |
          uv run python -m market_fx.report

      - name: Deploy to GitHub Pages (gh-pages orphan branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          keep_files: true

      - name: Commit and push memory updates to state branch
        if: always() && hashFiles('state/.git/config') != ''
        working-directory: state
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          mkdir -p market-fx
          if [ -f market-fx/history.json ]; then
            git add market-fx/history.json
            if ! git diff --staged --quiet; then
              git commit -m "chore(market-fx): update memory state [skip ci]"
              git push origin state/market-fx
            fi
          fi
