name: World News

on:
  schedule:
    # UTC 23:35 (每天) -> 北京时间 次日 07:35 (晨间错峰黄金时间，避开整点排队延迟)
    - cron: '35 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-world-news:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code (master)
        uses: actions/checkout@v7

      - name: Checkout Agent State (state/world-news branch)
        uses: actions/checkout@v7
        with:
          ref: state/world-news
          path: state
          fetch-depth: 0
        continue-on-error: true

      - name: Checkout existing Docs (gh-pages branch)
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: docs
        continue-on-error: true

      - name: Clean git metadata from docs
        run: rm -rf docs/.git
        continue-on-error: true

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Run World News Report
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PAGES_BASE_URL: https://crimson-and-clover.github.io/daily-actions
          PYTHONUNBUFFERED: "1"
        run: |
          uv run python -m world_news.report

      - name: Deploy to GitHub Pages (gh-pages orphan branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          keep_files: true

      - name: Commit and push memory updates to state branch
        if: always() && hashFiles('state/.git/config') != ''
        working-directory: state
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          mkdir -p world-news
          if [ -f world-news/history.json ]; then
            git add world-news/history.json
            if ! git diff --staged --quiet; then
              git commit -m "chore(world-news): update memory state [skip ci]"
              git push origin state/world-news
            fi
          fi
