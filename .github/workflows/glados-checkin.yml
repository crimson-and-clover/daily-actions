name: Glados Checkin

on:
  workflow_dispatch:

concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Run checkin script
        env:
          COOKIES_GLADOS: ${{ secrets.COOKIES_GLADOS }}
          PYTHONUNBUFFERED: "1"
        run: |
          uv run python -m glados_checkin.checkin
