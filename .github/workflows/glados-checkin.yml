name: Glados Checkin

on:
  schedule:
    # 北京时间 08:00 = UTC 00:00
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Run checkin script
        env:
          COOKIES_GLADOS: ${{ secrets.COOKIES_GLADOS }}
        run: |
          uv run python src/glados-checkin/checkin.py
