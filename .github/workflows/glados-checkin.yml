name: Glados Checkin

on:
  schedule:
    # 北京时间 08:20 = UTC 00:20 (错峰)
    - cron: "20 0 * * *"
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Run checkin script
        env:
          COOKIES_GLADOS: ${{ secrets.COOKIES_GLADOS }}
          PYTHONUNBUFFERED: "1"
        run: |
          uv run python -m glados_checkin.checkin
