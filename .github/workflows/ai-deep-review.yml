name: OpenHands AI Deep PR Review
run-name: OpenHands 深度审查 · PR #${{ inputs.pr_number }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR 编号
        type: string
        required: true
      head_sha:
        description: 预期审查的提交 SHA（手动运行可留空）
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-deep-review:
    runs-on: ubuntu-24.04

    steps:
      - name: Fetch PR Details
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "PR 编号无效。"
            exit 1
          fi
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,headRefName,headRefOid,isCrossRepository,baseRefName,number,title > pr_info.json
          head_sha=$(jq -r .headRefOid pr_info.json)
          if [[ $(jq -r .state pr_info.json) != OPEN || ( -n "$EXPECTED_HEAD_SHA" && "$head_sha" != "$EXPECTED_HEAD_SHA" ) ]]; then
            echo "PR 已关闭或提交已更新，请针对当前提交重新发起审查。"
            exit 1
          fi
          if [[ $(jq -r .isCrossRepository pr_info.json) != false ]]; then
            echo "深度审查只支持同仓库分支。"
            exit 1
          fi

          echo "head_ref=$(jq -r .headRefName pr_info.json)" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "base_ref=$(jq -r .baseRefName pr_info.json)" >> "$GITHUB_OUTPUT"
          echo "pr_number=$(jq -r .number pr_info.json)" >> "$GITHUB_OUTPUT"

      - name: Checkout OpenHands extensions
        uses: actions/checkout@v7
        with:
          repository: OpenHands/extensions
          path: extensions

      - name: Checkout PR repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: pr-repo
          submodules: recursive

      - name: Prepare Base Branch for Diff
        working-directory: pr-repo
        env:
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: |
          git branch -- "$BASE_REF" "refs/remotes/origin/$BASE_REF"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Run OpenHands PR Review
        continue-on-error: true
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          UV_PYTHON: '3.12'
          OPENHANDS_SDK_PACKAGE: 'openhands-sdk'
          AGENT_KIND: 'openhands'
          LLM_MODEL: 'deepseek/deepseek-flash'
          LLM_BASE_URL: 'https://api.deepseek.com'
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_SUB_AGENTS: 'false'
          LOAD_PUBLIC_SKILLS: 'false'
          COLLECT_FEEDBACK: 'true'
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          PR_BASE_BRANCH: ${{ steps.pr.outputs.base_ref }}
          PR_HEAD_BRANCH: ${{ steps.pr.outputs.head_ref }}
          REPO_NAME: ${{ github.repository }}
          REVIEW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PR_TITLE=$(jq -r .title pr_info.json)
          export PR_TITLE
          cd pr-repo
          uv run --no-project --with "$OPENHANDS_SDK_PACKAGE" --with openhands-tools --with lmnr --with "fastmcp<4" --with "fastmcp-slim<4" \
            python ../extensions/plugins/pr-review/scripts/agent_script.py


