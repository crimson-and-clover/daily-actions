[config]
# 使用 LiteLLM 格式接入 DeepSeek API
model = "deepseek/deepseek-chat"
fallback_models = ["deepseek/deepseek-chat"]
# 统一使用简体中文输出
response_language = "zh-CN"

[pr_reviewer]
# 严格遵守 AGENTS.md 审查规范
extra_instructions = """
所有代码审查（包括总结、行级评论与建议）必须全部使用简体中文输出。
严格聚焦 Diff: 仅聚焦于本次 PR 的变更代码及直接关联逻辑，严禁向无关的上下游历史模块无节制延伸发散。
重点审查潜在的逻辑 Bug、性能问题、安全性隐患与异常处理缺失。
针对具体的改进建议，尽量附带精准清晰的代码示例。
"""
# 禁用冗余的使用帮助后缀，保持审查报告紧凑干净
enable_help_text = false
# 审查时对关键建议开启代码引用行
enable_inline_comments = true
