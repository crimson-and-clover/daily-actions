[project]
name = "daily-actions"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arxiv>=4.0.1",
    "beautifulsoup4>=4.15.0",
    "cryptography>=43.0.0",
    "feedparser>=6.0.14",
    "imapclient>=4.1.0",
    "jinja2>=3.1.6",
    "json-repair>=0.64.1",
    "openai>=3.28.0",
    "openreview-py>=2.9.0",
    "pandas>=3.0.6",
    "pendulum>=3.3.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.2",
    "redmail>=0.6.0",
    "requests>=2.34.2",
    "tenacity>=9.2.1",
    "trafilatura>=2.3.1",
    "yfinance>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inbox_agent", "src/paper_agent", "src/market_fx", "src/world_news", "src/glados_checkin", "src/ffmpeg_mirror", "src/reviewer_radar", "src/utils"]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 256
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined variables, etc.)
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modern python syntax)
    "B",   # flake8-bugbear (common bug patterns)
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
